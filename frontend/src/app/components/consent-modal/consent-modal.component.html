<div class="modal-overlay">
  <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="consent-title">
    <div class="modal-icon">⚖️</div>
    <h2 id="consent-title">서비스 이용 전 안내</h2>

    <div class="consent-body">
      <p class="lead">
        <strong>주린이 차트</strong>는 주식 초보자를 위한 <strong>교육·정보 제공 서비스</strong>입니다.
      </p>

      <ul class="notice-list">
        <li>본 서비스는 <strong>투자 추천·권유가 아닙니다.</strong></li>
        <li>모든 차트 분석은 과거 데이터 기반 참고 자료이며, 미래 수익을 보장하지 않습니다.</li>
        <li>투자 판단과 그에 따른 결과는 전적으로 본인의 책임입니다.</li>
        <li>패턴 신뢰도 수치는 과거 사례 기반 통계 지표이며 예측 보증이 아닙니다.</li>
      </ul>

      <p class="sub-notice">
        금융위원회 「자본시장과 금융투자업에 관한 법률」 준수를 위해 위 내용을 안내드립니다.
      </p>
    </div>

    <button class="btn-accept" (click)="onAccept()">
      내용을 확인했습니다 · 서비스 이용하기
    </button>
  </div>
</div>
